<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CVD Risk Calculator - Multi-Label</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        h1 {
            color: white;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        .form-container {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            margin-bottom: 30px;
        }
        
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .form-group {
            display: flex;
            flex-direction: column;
        }
        
        label {
            font-weight: 600;
            color: #333;
            margin-bottom: 5px;
            font-size: 0.9em;
        }
        
        input, select {
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
            transition: border-color 0.3s;
        }
        
        input:focus, select:focus {
            outline: none;
            border-color: #667eea;
        }
        
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.1em;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            font-weight: 600;
            transition: transform 0.2s;
        }
        
        button:hover {
            transform: translateY(-2px);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        .results {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            display: none;
        }
        
        .results.show {
            display: block;
            animation: fadeIn 0.5s;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .results h2 {
            color: #333;
            margin-bottom: 20px;
            text-align: center;
        }
        
        .disease-card {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 15px;
            border-left: 5px solid #667eea;
        }
        
        .disease-card.high {
            border-left-color: #e74c3c;
            background: #fdf2f2;
        }
        
        .disease-card.medium {
            border-left-color: #f39c12;
            background: #fef9e7;
        }
        
        .disease-card.low {
            border-left-color: #27ae60;
            background: #f0f9f4;
        }
        
        .disease-name {
            font-weight: 600;
            color: #333;
            margin-bottom: 10px;
            font-size: 1.1em;
        }
        
        .probability-bar {
            width: 100%;
            height: 25px;
            background: #e0e0e0;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 8px;
        }
        
        .probability-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            transition: width 0.5s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
        }
        
        .risk-level {
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 600;
            text-transform: uppercase;
        }
        
        .risk-level.high {
            background: #e74c3c;
            color: white;
        }
        
        .risk-level.medium {
            background: #f39c12;
            color: white;
        }
        
        .risk-level.low {
            background: #27ae60;
            color: white;
        }
        
        .error {
            background: #e74c3c;
            color: white;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            display: none;
        }
        
        .error.show {
            display: block;
        }
        
        .timestamp {
            text-align: center;
            color: #666;
            margin-top: 15px;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🫀 CVD Risk Calculator</h1>
        <p style="color: white; text-align: center; margin-bottom: 30px; font-size: 1.1em;">
            Мультилейбловая классификация сердечно-сосудистых заболеваний
        </p>
        
        <div class="form-container">
            <div class="form-grid">
                <div class="form-group">
                    <label for="age">Возраст (лет)</label>
                    <input type="number" id="age" min="18" max="100" value="45" required>
                </div>
                
                <div class="form-group">
                    <label for="sex">Пол</label>
                    <select id="sex" required>
                        <option value="0">Женский</option>
                        <option value="1">Мужской</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="smoking">Курение</label>
                    <select id="smoking" required>
                        <option value="0">Нет</option>
                        <option value="1">Да</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="cholesterol">Холестерин (мг/дл)</label>
                    <input type="number" id="cholesterol" min="100" max="400" value="200" step="10" required>
                </div>
                
                <div class="form-group">
                    <label for="systolic_bp">Систолическое давление</label>
                    <input type="number" id="systolic_bp" min="80" max="200" value="120" required>
                </div>
                
                <div class="form-group">
                    <label for="diastolic_bp">Диастолическое давление</label>
                    <input type="number" id="diastolic_bp" min="40" max="130" value="80" required>
                </div>
                
                <div class="form-group">
                    <label for="height">Рост (см)</label>
                    <input type="number" id="height" min="100" max="220" value="170" required>
                </div>
                
                <div class="form-group">
                    <label for="weight">Вес (кг)</label>
                    <input type="number" id="weight" min="30" max="200" value="70" step="0.5" required>
                </div>
                
                <div class="form-group">
                    <label for="pulse">Пульс (уд/мин)</label>
                    <input type="number" id="pulse" min="40" max="200" value="70" required>
                </div>
                
                <div class="form-group">
                    <label for="glucose">Глюкоза (мг/дл)</label>
                    <input type="number" id="glucose" min="50" max="400" value="100" step="10" required>
                </div>
                
                <div class="form-group">
                    <label for="diabetes">Диабет</label>
                    <select id="diabetes" required>
                        <option value="0">Нет</option>
                        <option value="1">Да</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="hypertension">Гипертония</label>
                    <select id="hypertension" required>
                        <option value="0">Нет</option>
                        <option value="1">Да</option>
                    </select>
                </div>
            </div>
            
            <button onclick="predictRisk()">🔮 Рассчитать риск</button>
            
            <div class="error" id="error"></div>
        </div>
        
        <div class="results" id="results">
            <h2>📊 Результаты оценки риска</h2>
            <div id="predictions"></div>
            <div class="timestamp" id="timestamp"></div>
        </div>
    </div>
    
    <script>
        const API_URL = 'http://localhost:8000/api/v1';
        
        const diseaseNames = {
            'ischemic_heart': 'Ишемическая болезнь сердца',
            'hypertensive_heart': 'Гипертензивная болезнь сердца',
            'heart_failure': 'Сердечная недостаточность',
            'pericardial_disease': 'Болезнь перикарда',
            'heart_tumor': 'Опухоль сердца'
        };
        
        async function predictRisk() {
            const errorDiv = document.getElementById('error');
            const resultsDiv = document.getElementById('results');
            
            try {
                const requestData = {
                    age: parseInt(document.getElementById('age').value),
                    sex: parseInt(document.getElementById('sex').value),
                    smoking: parseInt(document.getElementById('smoking').value),
                    cholesterol: parseFloat(document.getElementById('cholesterol').value),
                    systolic_bp: parseInt(document.getElementById('systolic_bp').value),
                    diastolic_bp: parseInt(document.getElementById('diastolic_bp').value),
                    height: parseFloat(document.getElementById('height').value),
                    weight: parseFloat(document.getElementById('weight').value),
                    pulse: parseInt(document.getElementById('pulse').value),
                    glucose: parseFloat(document.getElementById('glucose').value),
                    diabetes: parseInt(document.getElementById('diabetes').value),
                    hypertension: parseInt(document.getElementById('hypertension').value)
                };
                
                errorDiv.classList.remove('show');
                resultsDiv.classList.remove('show');
                
                const response = await fetch(`${API_URL}/predict`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(requestData)
                });
                
                if (!response.ok) {
                    throw new Error('Ошибка сервера: ' + response.status);
                }
                
                const data = await response.json();
                displayResults(data);
                
            } catch (error) {
                errorDiv.textContent = 'Ошибка: ' + error.message;
                errorDiv.classList.add('show');
                console.error('Error:', error);
            }
        }
        
        function displayResults(data) {
            const predictionsDiv = document.getElementById('predictions');
            const timestampDiv = document.getElementById('timestamp');
            const resultsDiv = document.getElementById('results');
            
            predictionsDiv.innerHTML = '';
            
            data.predictions.forEach(pred => {
                const card = document.createElement('div');
                card.className = `disease-card ${pred.risk_level}`;
                
                const probabilityPercent = (pred.probability * 100).toFixed(1);
                
                card.innerHTML = `
                    <div class="disease-name">${diseaseNames[pred.disease] || pred.disease}</div>
                    <div class="probability-bar">
                        <div class="probability-fill" style="width: ${probabilityPercent}%">
                            ${probabilityPercent}%
                        </div>
                    </div>
                    <span class="risk-level ${pred.risk_level}">${getRiskLevelText(pred.risk_level)}</span>
                `;
                
                predictionsDiv.appendChild(card);
            });
            
            timestampDiv.textContent = 'Время расчёта: ' + new Date(data.timestamp).toLocaleString('ru-RU');
            resultsDiv.classList.add('show');
        }
        
        function getRiskLevelText(level) {
            const texts = {
                'low': 'Низкий риск',
                'medium': 'Средний риск',
                'high': 'Высокий риск'
            };
            return texts[level] || level;
        }
    </script>
</body>
</html>
